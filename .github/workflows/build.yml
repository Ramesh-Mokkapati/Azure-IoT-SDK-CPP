name: Build Azure IoT SDK C++ Samples

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Solution (x64 Debug + Release)
    runs-on: windows-latest

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5.1.0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Create vcpkg cache directory
        shell: powershell
        run: New-Item -ItemType Directory -Path "${{ github.workspace }}\.vcpkg-cache" -Force | Out-Null

      - name: Cache vcpkg Binary Cache
        uses: actions/cache@v5.1.0
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: ${{ runner.os }}-vcpkg-binary-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-binary-

      - name: Bootstrap vcpkg and Restore Packages
        shell: powershell
        run: |
          .\scripts\bootstrap-vcpkg.ps1 -SolutionDir "$PWD" -Triplet "x64-windows"

      - name: Build Release
        shell: cmd
        run: |
          msbuild "Azure-Examples.sln" /p:Configuration=Release /p:Platform=x64 /m

      - name: Build Debug
        shell: cmd
        run: |
          msbuild "Azure-Examples.sln" /p:Configuration=Debug /p:Platform=x64 /m

      - name: Prepare Artifact Directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\build-output\Release -Force | Out-Null
          New-Item -ItemType Directory -Path .\build-output\Debug   -Force | Out-Null
          Get-ChildItem -Path .\x64\Release -Filter *.exe -File | Copy-Item -Destination .\build-output\Release\ -Force
          Get-ChildItem -Path .\x64\Release -Filter *.dll -File | Copy-Item -Destination .\build-output\Release\ -Force
          Get-ChildItem -Path .\x64\Debug   -Filter *.exe -File | Copy-Item -Destination .\build-output\Debug\   -Force
          Get-ChildItem -Path .\x64\Debug   -Filter *.dll -File | Copy-Item -Destination .\build-output\Debug\   -Force

      - name: Upload Combined Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Azure-IoT-CPP-Samples-x64
          path: .\build-output\
          retention-days: 7