name: Build Azure IoT SDK C++ Samples

on:
  push:
    branches: [ "main", "master" ]
    tags:     [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Solution (x64 Debug + Release)
    runs-on: windows-latest

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5.1.0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Create vcpkg cache directory
        shell: powershell
        run: New-Item -ItemType Directory -Path "${{ github.workspace }}\.vcpkg-cache" -Force | Out-Null

      - name: Cache vcpkg Binary Cache
        uses: actions/cache@v5.1.0
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: ${{ runner.os }}-vcpkg-binary-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-binary-

      - name: Bootstrap vcpkg and Restore Packages
        shell: powershell
        run: |
          .\scripts\bootstrap-vcpkg.ps1 -SolutionDir "$PWD" -Triplet "x64-windows"

      - name: Build Release
        shell: cmd
        run: |
          msbuild "Azure-Examples.sln" /p:Configuration=Release /p:Platform=x64 /m

      - name: Build Debug
        shell: cmd
        run: |
          msbuild "Azure-Examples.sln" /p:Configuration=Debug /p:Platform=x64 /m

      - name: Prepare Artifact Directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\build-output\Release -Force | Out-Null
          New-Item -ItemType Directory -Path .\build-output\Debug   -Force | Out-Null
          Get-ChildItem -Path .\x64\Release -Filter *.exe -File | Copy-Item -Destination .\build-output\Release\ -Force
          Get-ChildItem -Path .\x64\Release -Filter *.dll -File | Copy-Item -Destination .\build-output\Release\ -Force
          Get-ChildItem -Path .\x64\Debug   -Filter *.exe -File | Copy-Item -Destination .\build-output\Debug\   -Force
          Get-ChildItem -Path .\x64\Debug   -Filter *.dll -File | Copy-Item -Destination .\build-output\Debug\   -Force

      - name: Upload Combined Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Azure-IoT-CPP-Samples-x64
          path: .\build-output\
          retention-days: 7

  # -------------------------------------------------------------------------
  # Publish the Release binaries as a GitHub Release when a v*.*.* tag is
  # pushed. Release assets don't expire, unlike the 7-day artifact above.
  # The zip holds the runnable files flat: the sample exes + Azure SDK DLLs.
  # -------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Every successful push to the default branch is released automatically
    # (tag v<VERSION_PREFIX>.<run number> is created); pushing a v*.*.* tag
    # yourself releases exactly that tag. Pull requests never release.
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    env:
      VERSION_PREFIX: "1.1"   # major.minor of automatic versions
    permissions:
      contents: write       # required to create / update a GitHub Release

    steps:
      - name: Work out release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then tag="${{ github.ref_name }}"
          else tag="v${VERSION_PREFIX}.${{ github.run_number }}"; fi
          echo "Release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: Azure-IoT-CPP-Samples-x64
          path: package

      - name: Zip Release binaries
        run: |
          cd package/Release
          zip -r "../../Azure-IoT-SDK-CPP-${{ steps.tag.outputs.tag }}-x64.zip" .

      # Every exe/DLL must load on a clean machine: no Debug C++ runtime (not
      # redistributable), and every DLL it imports is either next to it in the
      # package, a standard Windows DLL, or part of the VC++ 2015-2022 runtime
      # (incl. MFC) that the ComponentSuite installer requires.
      - name: Check runtime dependencies
        env:
          PKG: package/Release
        run: |
          command -v objdump > /dev/null || { echo "::error::objdump not found, so the dependency check cannot run"; exit 1; }
          allowed='^(kernel32|kernelbase|ntdll|user32|gdi32|gdiplus|advapi32|shell32|shlwapi|ole32|oleaut32|oleacc|oledlg|comctl32|comdlg32|uxtheme|dwmapi|imm32|msimg32|winmm|version|setupapi|cfgmgr32|rstrtmgr|virtdisk|ws2_32|mswsock|iphlpapi|netapi32|dnsapi|winhttp|wininet|urlmon|webservices|crypt32|bcrypt|ncrypt|secur32|wintrust|rpcrt4|userenv|psapi|dbghelp|wtsapi32|powrprof|propsys|normaliz|wldap32|msvcrt|api-ms-win-[a-z0-9-]+|ext-ms-win-[a-z0-9-]+|msvcp140(_1|_2|_atomic_wait|_codecvt_ids)?|vcruntime140(_1)?|concrt140|vcomp140|mfc140u?|mfcm140u?|ucrtbase)\.dll$'
          debugcrt='^(msvcp140d|msvcp140_1d|msvcp140_2d|vcruntime140d|vcruntime140_1d|concrt140d|ucrtbased|mfc140u?d|mfcm140u?d)\.dll$'
          fail=0; checked=0
          while IFS= read -r -d '' f; do
            checked=$((checked + 1)); dir=$(dirname "$f"); name=${f#"$PKG"/}
            for dep in $(objdump -p "$f" | sed -n 's/^[[:space:]]*DLL Name: //p' | tr 'A-Z' 'a-z'); do
              if [[ $dep =~ $debugcrt ]]; then
                echo "::error::$name needs the Debug C++ runtime ($dep), which isn't redistributable"; fail=1
              elif [ -z "$(find "$dir" -maxdepth 1 -iname "$dep" -print -quit)" ] && ! [[ $dep =~ $allowed ]]; then
                echo "::error::$name needs $dep, which isn't in the package"; fail=1
              fi
            done
          done < <(find "$PKG" -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
          [ "$checked" -gt 0 ] || { echo "::error::no .exe/.dll files found in $PKG"; exit 1; }
          echo "Checked $checked binaries"
          exit $fail

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: Azure-IoT-SDK-CPP-${{ steps.tag.outputs.tag }}-x64.zip
          generate_release_notes: true   # auto-generates notes from merged PRs / commits
          # v1.2.0-rc1 etc. become pre-releases, so they never count as the "latest" release
          # that downstream packaging (the ComponentSuite installer) picks up.
          prerelease: ${{ contains(github.ref_name, '-') }}
